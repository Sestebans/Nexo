const TAB_PATHS = ["/", "/gastos", "/copiloto", "/metas", "/foro"];
function routeView(h, snap) {
  const r = parseRoute(h), u = r.path;
  if (TAB_PATHS.includes(u)) {
    const v = { "/": Home, "/gastos": Expenses, "/copiloto": Copilot, "/metas": Goals, "/foro": Forum }[u];
    return { view: v(snap), tab: true, path: u };
  }
  let m;
  if (u === "/gastos/nuevo") return { view: Register() };
  if (u === "/metas/nueva") return { view: NewGoal() };
  if ((m = u.match(/^\/metas\/([^/]+)$/))) return { view: GoalDetail(m[1], r.query.get("editar") === "1", snap) };
  if (u === "/foro/nueva") return { view: NewPost() };
  if ((m = u.match(/^\/foro\/([^/]+)$/))) return { view: PostDetail(m[1]) };
  if (u === "/racha") return { view: Rewards(snap) };
  if (u === "/perfil") return { view: Profile(snap) };
  if (u === "/avisos") return { view: Notifications() };
  return { view: Home(snap), tab: true, path: "/" };
}

/* ---------- Render ---------- */
const root = document.getElementById("root");
let chatKey = null;

function appHtml() {
  const h = fc();
  const onboarded = state.profile.onboarded;
  let body;
  if (!onboarded) {
    body = '<div class="app-shell">' + Onboarding() + "</div>";
  } else {
    const snap = Yf(state);
    const m = routeView(h, snap);
    body = '<div class="app-shell"><main class="main ' + (m.tab ? "" : "plain") + '">' + (m.tab ? TopBar(m.path, snap) : "") + m.view + "</main>" + (m.tab ? BottomNav(m.path) : "") + "</div>";
  }
  return body + '<div class="toast-zone" aria-live="polite">' + (toastText ? '<div class="toast">' + E(toastText) + "</div>" : "") + "</div>";
}

function render() {
  const onb = state.profile.onboarded;
  let h = fc();
  if (!onb && !h.startsWith("/bienvenida")) { window.location.replace("#/bienvenida"); h = fc(); }
  else if (onb && h.startsWith("/bienvenida")) { window.location.replace("#/"); h = fc(); }
  const routeChanged = h !== lastHash;
  if (routeChanged) { resetUI(); lastHash = h; chatKey = null; }

  const active = document.activeElement;
  let fk = null, ss = null, se = null, idx = -1, tag = null;
  if (!routeChanged && active && root.contains(active)) {
    if (active.dataset && active.dataset.fk) { fk = active.dataset.fk; ss = active.selectionStart; se = active.selectionEnd; }
    else {
      const all = root.querySelectorAll("button,input,textarea");
      idx = Array.prototype.indexOf.call(all, active);
      tag = active.tagName;
    }
  }
  const sy = window.scrollY;
  const chipScroll = Array.prototype.map.call(root.querySelectorAll(".chips.scroll"), function (e) { return e.scrollLeft; });
  root.style.minHeight = root.offsetHeight + "px";
  root.innerHTML = appHtml();

  if (routeChanged) window.scrollTo(0, 0); else window.scrollTo(0, sy);
  root.style.minHeight = "";
  Array.prototype.forEach.call(root.querySelectorAll(".chips.scroll"), function (e, i) { if (!routeChanged && chipScroll[i] != null) e.scrollLeft = chipScroll[i]; });

  let focused = false;
  if (fk) {
    const el = root.querySelector('[data-fk="' + fk + '"]');
    if (el) {
      el.focus({ preventScroll: true });
      try {
        if (el.dataset.end) { const l = el.value.length; el.setSelectionRange(l, l); }
        else if (ss != null) el.setSelectionRange(ss, se);
      } catch (e) {}
      focused = true;
    }
  } else if (idx >= 0) {
    const all = root.querySelectorAll("button,input,textarea");
    if (all[idx] && all[idx].tagName === tag) { all[idx].focus({ preventScroll: true }); focused = true; }
  }
  if (!focused) {
    const af = root.querySelector("[data-autofocus]");
    if (af && !ui.afDone) { ui.afDone = true; af.focus(); }
  }

  if (h.split("?")[0] === "/copiloto" && onb) {
    const key = state.chat.length + ":" + (ui.cp && ui.cp.loading);
    if (key !== chatKey) {
      chatKey = key;
      const endEl = document.getElementById("chat-end");
      if (endEl && endEl.scrollIntoView) endEl.scrollIntoView({ block: "end" });
    }
  }
}

async function askCopilot(text) {
  const s = ui.cp;
  const q = text.trim();
  if (!q || s.loading) return;
  s.text = "";
  actions.chatAdd({ id: pt(), from: "you", text: q });
  const snap = Yf(state);
  const intent = Mc(q);
  if (Yp(intent) && !snap.hasEnoughData) {
    actions.chatAdd({ id: pt(), from: "nexo", insufficient: true, text: "Me faltan datos para responder bien." });

  }
  s.loading = true;
  render();
  const J = await bp({ question: q, snapshot: snap, history: state.chat, pro: Fr(state.rewards) });

}
