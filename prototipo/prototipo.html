<script>
(function () {
  var SCREENS = ["f1-1-carrusel","f1-2-datos-iniciales","f1-3-datos-incompletos","f1-4-dashboard","f1-5-registrar-gasto","f1-6-error-gasto","f1-7-gasto-guardado","f2-1-chat-copiloto","f2-2-info-insuficiente","f2-3-respuesta-recomendacion","f2-4-meta-actualizada","f2-5-progreso-recompensa","f3-1-feed-preguntas","f3-2-detalle-pregunta","f3-3-escribir-pregunta","f3-4-pregunta-invalida","f3-5-pregunta-publicada","mapa-conexiones"];
  var app = document.getElementById("app");
  var current = null;
  function show() {
    var id = location.hash.replace(/^#/, "");
    if (SCREENS.indexOf(id) === -1) id = current || SCREENS[0];
    if (id === current) return;
    var t = document.getElementById("t-" + id);
    app.innerHTML = '<div class="scr" id="s-' + id + '"></div>';
    app.firstChild.appendChild(t.content.cloneNode(true));
    current = id;
    window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a");
    if (a && a.getAttribute("href") === "#") e.preventDefault();
  });
  window.addEventListener("hashchange", show);
  show();
})();
</script>
